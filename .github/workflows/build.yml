name: Build and release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Windows and Linux release archives inside Docker
        uses: ./.github/actions/container-build
        with:
          mode: package
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: update-manifest-signer
          path: validation/oshell-release
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: oshell-windows-amd64
          path: dist/OShell-Desktop-windows-amd64-single-file.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: oshell-linux-amd64
          path: dist/OShell-Desktop-linux-amd64.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker run --rm -e RELEASE_TAG -v "$PWD:/workspace:ro" -w /workspace python:3.12-slim python -c 'import json,os; assert os.environ["RELEASE_TAG"] == "v" + json.load(open("mygo.json"))["version"], "Release tag must match application version"'
      - uses: actions/download-artifact@v4
        with:
          pattern: oshell-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: update-manifest-signer
          path: release-tools
      - name: Sign and verify the portable update manifest
        shell: bash
        env:
          OSHELL_UPDATE_SIGNING_KEY: ${{ secrets.OSHELL_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > release-notes.txt
          chmod +x release-tools/oshell-release
          printf '%s' "$OSHELL_UPDATE_SIGNING_KEY" | release-tools/oshell-release -repo "$GITHUB_REPOSITORY" \
            -tag "$GITHUB_REF_NAME" -build "$GITHUB_RUN_NUMBER" -notes release-notes.txt -dir release-assets
      - name: Publish Windows and Linux release packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum OShell-Desktop-windows-amd64-single-file.zip OShell-Desktop-linux-amd64.tar.gz > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file ../release-notes.txt --latest \
            OShell-Desktop-windows-amd64-single-file.zip OShell-Desktop-linux-amd64.tar.gz SHA256SUMS.txt latest.json
